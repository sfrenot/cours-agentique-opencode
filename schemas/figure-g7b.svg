<svg xmlns="http://www.w3.org/2000/svg" class="patron" viewBox="0 0 160 222" role="img" aria-label="Patron en croix : fond au centre, côtés à gauche et à droite avec pattes de collage, avant en bas, dos puis couvercle en haut, rabat au-dessus. Traits pleins à découper, pointillés à plier.">
<style>
