<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-label="Quatre niveaux : prompt seul ; prompt structuré avec rôle et format ; prompt accompagné d'extraits de documentation (RAG) ; harnais qui boucle entre le LLM et des outils.">
<style>
svg{font-family:"IBM Plex Sans","Segoe UI",system-ui,sans-serif}
text{fill:#17212b;font-size:13px}
.box{fill:#ffffff;stroke:currentColor;stroke-width:1.3}
.box-acc{fill:#e1f0f1;stroke:#0b6b73;stroke-width:1.6}
.zone{fill:none;stroke:#d9dee3;stroke-width:1.3;stroke-dasharray:5 4}
.ln{stroke:currentColor;stroke-width:1.4;fill:none}
.ln-acc{stroke:#0b6b73;stroke-width:1.8;fill:none}
.dash{stroke-dasharray:5 4}
text{fill:currentColor;font-size:13px}
.lbl{font-size:11.5px;fill:#566370}
.ttl{font-family:"Space Grotesk","Segoe UI",system-ui,sans-serif;font-weight:600;font-size:13.5px}
.acc{fill:#0b6b73}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-size:11.5px}
.arrowhead{fill:currentColor}
.arrowhead-acc{fill:#0b6b73}
.ln-blue{stroke:#1f5fd6;stroke-width:1.9;fill:none}
.blue{fill:#1f5fd6}
.arrowhead-blue{fill:#1f5fd6}
.deny{fill:#b3261e}
text{font-size:5.5px}
.cut{fill:#e1f0f1;stroke:currentColor;stroke-width:.6}
.erase{stroke:#e1f0f1;stroke-width:1.2}
.fold{stroke:#0b6b73;stroke-width:.6;stroke-dasharray:2 1.5}
.dim{stroke:currentColor;stroke-width:.4}
.face{fill:#ffffff;stroke:currentColor;stroke-width:1.3;stroke-linejoin:round}
.face-in{fill:#d9dee3;stroke:currentColor;stroke-width:1.3;stroke-linejoin:round}
.face-acc{fill:#e1f0f1;stroke:#0b6b73;stroke-width:1.5;stroke-linejoin:round}

</style>
<rect width="100%" height="100%" fill="#ffffff"/>
<defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrowhead"/></marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrowhead-blue"/></marker>
    <marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrowhead-acc"/></marker>
  </defs>

  <text class="lbl" x="20" y="22">ce qui est envoyé au LLM</text>
  <text class="ttl" x="20" y="58">1 · Prompt</text>
  <rect class="box-acc" x="220" y="40" width="130" height="28" rx="4"/><text x="285" y="59" text-anchor="middle">question</text>
  <line class="ln" x1="350" y1="54" x2="690" y2="54" marker-end="url(#ah)"/><text class="lbl" x="700" y="58">réponse</text>

  <text class="ttl" x="20" y="108">2 · Prompt engineering</text>
  <rect class="box" x="220" y="90" width="70" height="28" rx="4"/><text x="255" y="109" text-anchor="middle">rôle</text>
  <rect class="box" x="294" y="90" width="70" height="28" rx="4"/><text x="329" y="109" text-anchor="middle">format</text>
  <rect class="box-acc" x="368" y="90" width="110" height="28" rx="4"/><text x="423" y="109" text-anchor="middle">question</text>
  <line class="ln" x1="478" y1="104" x2="690" y2="104" marker-end="url(#ah)"/><text class="lbl" x="700" y="108">réponse</text>

  <text class="ttl" x="20" y="158">3 · RAG</text>
  <rect class="box" x="220" y="140" width="150" height="28" rx="4"/><text x="295" y="159" text-anchor="middle">extraits de doc</text>
  <rect class="box-acc" x="374" y="140" width="110" height="28" rx="4"/><text x="429" y="159" text-anchor="middle">question</text>
  <line class="ln" x1="484" y1="154" x2="690" y2="154" marker-end="url(#ah)"/><text class="lbl" x="700" y="158">réponse</text>

  <text class="ttl" x="20" y="210">4 · Harnais / contexte</text>
  <rect class="box-acc" x="220" y="192" width="110" height="28" rx="4"/><text x="275" y="211" text-anchor="middle">tâche</text>
  <rect class="box" x="370" y="192" width="70" height="28" rx="4"/><text x="405" y="211" text-anchor="middle">LLM</text>
  <rect class="box" x="510" y="192" width="80" height="28" rx="4"/><text x="550" y="211" text-anchor="middle">outils</text>
  <line class="ln" x1="330" y1="206" x2="368" y2="206" marker-end="url(#ah)"/>
  <path class="ln-acc" d="M440,200 C470,184 482,184 508,200" marker-end="url(#aha)"/>
  <path class="ln-acc" d="M510,214 C482,232 470,232 442,214" marker-end="url(#aha)"/>
  <text class="lbl acc" x="475" y="246" text-anchor="middle">× n tours</text>
  <line class="ln" x1="590" y1="206" x2="690" y2="206" marker-end="url(#ah)"/><text class="lbl" x="700" y="210">réponse</text>
</svg>
