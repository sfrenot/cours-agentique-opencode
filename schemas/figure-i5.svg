<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" role="img" aria-label="L'utilisateur donne une tâche au harnais ; le harnais envoie contexte et liste d'outils au LLM ; si le LLM demande un outil, le harnais vérifie la permission, exécute l'outil, ajoute le résultat au contexte et rappelle le LLM ; sinon la réponse texte revient à l'utilisateur.">
<style>
svg{font-family:"IBM Plex Sans","Segoe UI",system-ui,sans-serif}
text{fill:#17212b;font-size:13px}
.box{fill:#ffffff;stroke:currentColor;stroke-width:1.3}
.box-acc{fill:#e1f0f1;stroke:#0b6b73;stroke-width:1.6}
.zone{fill:none;stroke:#d9dee3;stroke-width:1.3;stroke-dasharray:5 4}
.ln{stroke:currentColor;stroke-width:1.4;fill:none}
.ln-acc{stroke:#0b6b73;stroke-width:1.8;fill:none}
.dash{stroke-dasharray:5 4}
text{fill:currentColor;font-size:13px}
.lbl{font-size:11.5px;fill:#566370}
.ttl{font-family:"Space Grotesk","Segoe UI",system-ui,sans-serif;font-weight:600;font-size:13.5px}
.acc{fill:#0b6b73}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-size:11.5px}
.arrowhead{fill:currentColor}
.arrowhead-acc{fill:#0b6b73}
.ln-blue{stroke:#1f5fd6;stroke-width:1.9;fill:none}
.blue{fill:#1f5fd6}
.arrowhead-blue{fill:#1f5fd6}
.deny{fill:#b3261e}
text{font-size:5.5px}
.cut{fill:#e1f0f1;stroke:currentColor;stroke-width:.6}
.erase{stroke:#e1f0f1;stroke-width:1.2}
.fold{stroke:#0b6b73;stroke-width:.6;stroke-dasharray:2 1.5}
.dim{stroke:currentColor;stroke-width:.4}
.face{fill:#ffffff;stroke:currentColor;stroke-width:1.3;stroke-linejoin:round}
.face-in{fill:#d9dee3;stroke:currentColor;stroke-width:1.3;stroke-linejoin:round}
.face-acc{fill:#e1f0f1;stroke:#0b6b73;stroke-width:1.5;stroke-linejoin:round}

</style>
<rect width="100%" height="100%" fill="#ffffff"/>
<defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrowhead"/></marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrowhead-blue"/></marker>
    <marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrowhead-acc"/></marker>
  </defs>

  <rect class="box" x="20" y="110" width="120" height="60" rx="6"/>
  <text class="ttl" x="80" y="137" text-anchor="middle">Utilisateur</text>
  <text class="lbl" x="80" y="155" text-anchor="middle">demande</text>

  <rect class="box-acc" x="250" y="90" width="190" height="100" rx="6"/>
  <text class="ttl" x="345" y="114" text-anchor="middle">Harnais (opencode)</text>
  <text class="lbl" x="345" y="136" text-anchor="middle">assemble le contexte</text>
  <text class="lbl" x="345" y="154" text-anchor="middle">vérifie la permission</text>
  <text class="lbl" x="345" y="172" text-anchor="middle">exécute, ajoute le résultat</text>

  <rect class="box" x="580" y="110" width="150" height="60" rx="6"/>
  <text class="ttl" x="655" y="137" text-anchor="middle">LLM</text>
  <text class="lbl" x="655" y="155" text-anchor="middle">ne voit que le contexte</text>

  <rect class="box" x="270" y="230" width="150" height="44" rx="6"/>
  <text class="ttl" x="345" y="250" text-anchor="middle">Outils</text>
  <text class="lbl mono" x="345" y="266" text-anchor="middle">read · edit · bash · web</text>

  <line class="ln" x1="140" y1="128" x2="248" y2="128" marker-end="url(#ah)"/>
  <text class="lbl" x="194" y="120" text-anchor="middle">tâche</text>
  <line class="ln" x1="248" y1="156" x2="142" y2="156" marker-end="url(#ah)"/>
  <text class="lbl" x="194" y="174" text-anchor="middle">réponse finale</text>

  <line class="ln-acc" x1="440" y1="112" x2="578" y2="112" marker-end="url(#aha)"/>
  <text class="lbl" x="509" y="104" text-anchor="middle">contexte + outils</text>
  <line class="ln-acc" x1="578" y1="140" x2="442" y2="140" marker-end="url(#aha)"/>
  <text class="lbl acc" x="509" y="134" text-anchor="middle">appel_outil(args)</text>
  <line class="ln" x1="578" y1="166" x2="442" y2="166" marker-end="url(#ah)"/>
  <text class="lbl" x="509" y="182" text-anchor="middle">ou : texte → fin</text>

  <line class="ln-acc" x1="325" y1="190" x2="325" y2="228" marker-end="url(#aha)"/>
  <text class="lbl" x="318" y="214" text-anchor="end">exécute</text>
  <line class="ln-acc" x1="365" y1="228" x2="365" y2="192" marker-end="url(#aha)"/>
  <text class="lbl" x="372" y="214">résultat</text>
  <text class="lbl acc" x="345" y="60" text-anchor="middle">la boucle tourne tant que le LLM demande un outil</text>
</svg>
