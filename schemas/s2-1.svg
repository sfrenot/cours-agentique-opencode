<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="Le harnais assemble à chaque appel un contexte empilé : prompt système, AGENTS.md, définitions des outils et skills, historique, résultats des outils. Le LLM ne voit que ce bloc. Ses appels d'outil passent par les permissions puis l'exécution, dont le résultat est ajouté en bas de la pile. La compaction résume l'historique.">
<style>
svg{font-family:"IBM Plex Sans","Segoe UI",system-ui,sans-serif}
text{fill:#17212b;font-size:13px}
.box{fill:#ffffff;stroke:currentColor;stroke-width:1.3}
.box-acc{fill:#e1f0f1;stroke:#0b6b73;stroke-width:1.6}
.zone{fill:none;stroke:#d9dee3;stroke-width:1.3;stroke-dasharray:5 4}
.ln{stroke:currentColor;stroke-width:1.4;fill:none}
.ln-acc{stroke:#0b6b73;stroke-width:1.8;fill:none}
.dash{stroke-dasharray:5 4}
text{fill:currentColor;font-size:13px}
.lbl{font-size:11.5px;fill:#566370}
.ttl{font-family:"Space Grotesk","Segoe UI",system-ui,sans-serif;font-weight:600;font-size:13.5px}
.acc{fill:#0b6b73}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-size:11.5px}
.arrowhead{fill:currentColor}
.arrowhead-acc{fill:#0b6b73}
.ln-blue{stroke:#1f5fd6;stroke-width:1.9;fill:none}
.blue{fill:#1f5fd6}
.arrowhead-blue{fill:#1f5fd6}
.deny{fill:#b3261e}
text{font-size:5.5px}
.cut{fill:#e1f0f1;stroke:currentColor;stroke-width:.6}
.erase{stroke:#e1f0f1;stroke-width:1.2}
.fold{stroke:#0b6b73;stroke-width:.6;stroke-dasharray:2 1.5}
.dim{stroke:currentColor;stroke-width:.4}
.face{fill:#ffffff;stroke:currentColor;stroke-width:1.3;stroke-linejoin:round}
.face-in{fill:#d9dee3;stroke:currentColor;stroke-width:1.3;stroke-linejoin:round}
.face-acc{fill:#e1f0f1;stroke:#0b6b73;stroke-width:1.5;stroke-linejoin:round}

</style>
<rect width="100%" height="100%" fill="#ffffff"/>
<defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrowhead"/></marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrowhead-blue"/></marker>
    <marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrowhead-acc"/></marker>
  </defs>

  <rect class="zone" x="20" y="20" width="270" height="320" rx="10"/>
  <text class="ttl" x="36" y="44">Harnais · du code</text>
  <text class="lbl" x="36" y="62">fixe pendant la session, configurable</text>
  <rect class="box" x="40" y="80" width="230" height="40" rx="6"/><text x="155" y="105" text-anchor="middle">Boucle d'agent</text>
  <rect class="box" x="40" y="132" width="230" height="40" rx="6"/><text x="155" y="157" text-anchor="middle">Assemble le contexte</text>
  <rect class="box" x="40" y="184" width="230" height="40" rx="6"/><text x="155" y="209" text-anchor="middle">Vérifie la permission</text>
  <rect class="box" x="40" y="236" width="230" height="40" rx="6"/><text x="155" y="261" text-anchor="middle">Exécute l'outil</text>
  <rect class="box" x="40" y="288" width="230" height="40" rx="6"/><text x="155" y="313" text-anchor="middle">Compaction si trop long</text>
  <line class="ln" x1="155" y1="224" x2="155" y2="234" marker-end="url(#ah)"/>

  <rect class="zone" x="360" y="20" width="250" height="320" rx="10"/>
  <text class="ttl" x="376" y="44">Contexte · du texte</text>
  <text class="lbl" x="376" y="62">reconstruit à chaque appel, il grossit</text>
  <rect class="box" x="380" y="80" width="210" height="34" rx="4"/><text x="485" y="102" text-anchor="middle">Prompt système</text>
  <rect class="box" x="380" y="118" width="210" height="34" rx="4"/><text x="485" y="140" text-anchor="middle">AGENTS.md</text>
  <rect class="box" x="380" y="156" width="210" height="34" rx="4"/><text x="485" y="178" text-anchor="middle">Outils + skills</text>
  <rect class="box" x="380" y="194" width="210" height="60" rx="4"/><text x="485" y="228" text-anchor="middle">Historique</text>
  <rect class="box-acc" x="380" y="258" width="210" height="60" rx="4"/><text x="485" y="292" text-anchor="middle">Résultats des outils</text>

  <rect class="box-acc" x="650" y="160" width="96" height="60" rx="6"/>
  <text class="ttl" x="698" y="186" text-anchor="middle">LLM</text>
  <text class="lbl" x="698" y="204" text-anchor="middle">voit le bloc</text>
  <line class="ln" x1="590" y1="190" x2="648" y2="190" marker-end="url(#ah)"/>

  <line class="ln" x1="270" y1="152" x2="378" y2="97" marker-end="url(#ah)"/>
  <text class="lbl" x="300" y="118">construit</text>
  <path class="ln-acc" d="M698,220 L698,350 L300,350 L300,204 L272,204" marker-end="url(#aha)"/>
  <text class="lbl acc" x="500" y="345" text-anchor="middle">appel d'outil</text>
  <line class="ln-acc" x1="270" y1="262" x2="378" y2="284" marker-end="url(#aha)"/>
  <text class="lbl acc" x="318" y="290">résultat ajouté</text>
  <path class="ln dash" d="M270,302 C330,302 340,232 378,226" marker-end="url(#ah)"/>
  <text class="lbl" x="304" y="244">résume</text>
</svg>
