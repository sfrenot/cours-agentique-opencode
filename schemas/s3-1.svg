<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="L'agent principal Build, sur le modèle 27b, délègue avec l'outil task à trois sous-agents : explore, web-explore sur le modèle 0,8b et remote-python qui exécute en SSH sur serveurllm. Chaque sous-agent a son propre contexte et ne renvoie qu'un résumé. Un sous-agent ne peut pas relancer de sous-agent.">
<style>
svg{font-family:"IBM Plex Sans","Segoe UI",system-ui,sans-serif}
text{fill:#17212b;font-size:13px}
.box{fill:#ffffff;stroke:currentColor;stroke-width:1.3}
.box-acc{fill:#e1f0f1;stroke:#0b6b73;stroke-width:1.6}
.zone{fill:none;stroke:#d9dee3;stroke-width:1.3;stroke-dasharray:5 4}
.ln{stroke:currentColor;stroke-width:1.4;fill:none}
.ln-acc{stroke:#0b6b73;stroke-width:1.8;fill:none}
.dash{stroke-dasharray:5 4}
text{fill:currentColor;font-size:13px}
.lbl{font-size:11.5px;fill:#566370}
.ttl{font-family:"Space Grotesk","Segoe UI",system-ui,sans-serif;font-weight:600;font-size:13.5px}
.acc{fill:#0b6b73}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-size:11.5px}
.arrowhead{fill:currentColor}
.arrowhead-acc{fill:#0b6b73}
.ln-blue{stroke:#1f5fd6;stroke-width:1.9;fill:none}
.blue{fill:#1f5fd6}
.arrowhead-blue{fill:#1f5fd6}
.deny{fill:#b3261e}
text{font-size:5.5px}
.cut{fill:#e1f0f1;stroke:currentColor;stroke-width:.6}
.erase{stroke:#e1f0f1;stroke-width:1.2}
.fold{stroke:#0b6b73;stroke-width:.6;stroke-dasharray:2 1.5}
.dim{stroke:currentColor;stroke-width:.4}
.face{fill:#ffffff;stroke:currentColor;stroke-width:1.3;stroke-linejoin:round}
.face-in{fill:#d9dee3;stroke:currentColor;stroke-width:1.3;stroke-linejoin:round}
.face-acc{fill:#e1f0f1;stroke:#0b6b73;stroke-width:1.5;stroke-linejoin:round}

</style>
<rect width="100%" height="100%" fill="#ffffff"/>
<defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrowhead"/></marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrowhead-blue"/></marker>
    <marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrowhead-acc"/></marker>
  </defs>

  <rect class="box-acc" x="280" y="20" width="200" height="64" rx="6"/>
  <text class="ttl" x="380" y="46" text-anchor="middle">Agent principal · Build</text>
  <text class="lbl mono" x="380" y="66" text-anchor="middle">qwen3.8:27b · contexte A</text>

  <rect class="box" x="30" y="170" width="200" height="64" rx="6"/>
  <text class="ttl" x="130" y="196" text-anchor="middle">explore</text>
  <text class="lbl" x="130" y="216" text-anchor="middle">lit le code · contexte B</text>
  <rect class="box" x="280" y="170" width="200" height="64" rx="6"/>
  <text class="ttl" x="380" y="196" text-anchor="middle">web-explore</text>
  <text class="lbl mono" x="380" y="216" text-anchor="middle">qwen3.5:0.8b · contexte C</text>
  <rect class="box" x="530" y="170" width="200" height="64" rx="6"/>
  <text class="ttl" x="630" y="196" text-anchor="middle">remote-python</text>
  <text class="lbl" x="630" y="216" text-anchor="middle">ssh vers serveurllm · contexte D</text>

  <line class="ln" x1="320" y1="84" x2="150" y2="168" marker-end="url(#ah)"/>
  <line class="ln" x1="370" y1="84" x2="370" y2="168" marker-end="url(#ah)"/>
  <line class="ln" x1="420" y1="84" x2="610" y2="168" marker-end="url(#ah)"/>
  <text class="lbl" x="214" y="120">task(prompt)</text>
  <line class="ln-acc dash" x1="170" y1="170" x2="336" y2="86" marker-end="url(#aha)"/>
  <line class="ln-acc dash" x1="392" y1="168" x2="392" y2="86" marker-end="url(#aha)"/>
  <line class="ln-acc dash" x1="590" y1="170" x2="440" y2="86" marker-end="url(#aha)"/>
  <text class="lbl acc" x="520" y="120">résumé seulement</text>

  <text class="lbl" x="380" y="268" text-anchor="middle"><tspan class="deny">task: deny</tspan> dans chaque sous-agent : profondeur maximale 1</text>
</svg>
